services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screening}
      POSTGRES_USER: ${POSTGRES_USER:-screening}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    ports:
      - "8000:8000"
    environment:
      COMPANY_DIRECTORY_MODE: krx_api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-screening}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-screening}
      APP_LOG_PATH: /app/runtime/logs/application.jsonl
      WORKFLOW_AUDIT_LOG_PATH: /app/runtime/logs/execution-audit.jsonl
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      KRX_API_KEY: ${KRX_API_KEY:?KRX_API_KEY is required}
      DART_API_KEY: ${DART_API_KEY:?DART_API_KEY is required}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_TIMEOUT_SECONDS: ${KIS_TIMEOUT_SECONDS:-10}
      IR_RSS_FEEDS: "${IR_RSS_FEEDS:-[]}"
      ARTICLE_MIN_BODY_LENGTH: ${ARTICLE_MIN_BODY_LENGTH:-300}
      ARTICLE_MAX_BODY_LENGTH: ${ARTICLE_MAX_BODY_LENGTH:-50000}
      SCHEDULE_SETTINGS_PASSWORD: ${SCHEDULE_SETTINGS_PASSWORD:-}
      SCHEDULE_COOKIE_SECURE: ${SCHEDULE_COOKIE_SECURE:-true}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./runtime/logs:/app/runtime/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://dashboard:8000
    ports:
      - "3000:3000"
    depends_on:
      - dashboard
    restart: unless-stopped

  db-migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-screening}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-screening}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  schedule-worker:
    build: .
    command: ["/app/.venv/bin/python", "-m", "app.scheduled_worker"]
    environment:
      COMPANY_DIRECTORY_MODE: krx_api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-screening}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-screening}
      APP_LOG_PATH: /app/runtime/logs/schedule-worker.jsonl
      WORKFLOW_AUDIT_LOG_PATH: /app/runtime/logs/execution-audit.jsonl
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      KRX_API_KEY: ${KRX_API_KEY:?KRX_API_KEY is required}
      DART_API_KEY: ${DART_API_KEY:?DART_API_KEY is required}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapi.koreainvestment.com:9443}
      KIS_TIMEOUT_SECONDS: ${KIS_TIMEOUT_SECONDS:-10}
      IR_RSS_FEEDS: "${IR_RSS_FEEDS:-[]}"
      ARTICLE_MIN_BODY_LENGTH: ${ARTICLE_MIN_BODY_LENGTH:-300}
      ARTICLE_MAX_BODY_LENGTH: ${ARTICLE_MAX_BODY_LENGTH:-50000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SCHEDULE_WORKER_ID: ${SCHEDULE_WORKER_ID:-schedule-worker}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./runtime/logs:/app/runtime/logs
    restart: unless-stopped

volumes:
  postgres_data:
