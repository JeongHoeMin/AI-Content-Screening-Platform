services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      COMPANY_DIRECTORY_MODE: krx_master_csv
      COMPANY_DIRECTORY_CSV_PATH: /app/data/company_directory.csv
    volumes:
      - ${COMPANY_DIRECTORY_HOST_CSV_PATH:-./data_0551_20260730.csv}:/app/data/company_directory.csv:ro
    restart: unless-stopped
