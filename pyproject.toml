[project]
name = "ai-content-screening-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "langchain>=0.3.30",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.11",
    "openai>=2.48.0",
    "pydantic>=2.13.4",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "rich>=15.0.0",
    "structlog>=25.5.0",
    "typer>=0.23.2",
    "uvicorn>=0.30.0",
]

[project.scripts]
screening = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
