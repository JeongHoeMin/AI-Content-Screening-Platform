schemaVersion: 1

id: "20260810-1520-sse-gzip-buffering-fix"
title: "Next.js gzip 압축이 SSE 진행 상황 스트림을 막는 문제 수정"
description: |
  사용자가 React 화면에서 추천 분석을 실행했을 때 경과 시간만 흐르고 진행 상황이 전혀 갱신되지
  않는다고 보고했다.
  원인 규명 과정에서 처음 두 가설(백엔드가 수집 완료 전에는 heartbeat를 보내지 않는다, 수집이
  이벤트 루프를 블로킹한다)은 모두 코드 확인으로 반증되었다. `_emit_heartbeats`는 수집 시작 전에
  이미 기동하고, HTTP 클라이언트는 asyncio.to_thread를 사용해 루프를 막지 않는다. 백엔드 SSE를
  직접 관찰한 결과 heartbeat가 5초 간격으로 정확히 송신되고 있었고, Next.js 프록시를 거친 curl
  에서도 45초에 14개 이벤트가 정상 수신되었다.
  결정적 차이는 Accept-Encoding이었다. curl은 압축을 요청하지 않지만 브라우저는 gzip을 요청한다.
  Next.js는 기본적으로 응답을 gzip 압축하며(`compress` 기본값 true), 압축 버퍼가 SSE 청크를
  붙잡아 스트림을 사실상 무력화한다. 동일 실행을 Accept-Encoding만 바꿔 비교한 결과,
  identity는 5초마다 데이터가 도착했고 gzip은 t+0에 15바이트(gzip 헤더)만 온 뒤 84초 동안 아무
  데이터도 오지 않다가 실행이 끝날 때 한꺼번에 도착했다. 브라우저에서 raw EventSource로 확인했을
  때도 readyState=1(OPEN), 오류 0인데 이벤트 수신은 0이었다.
  이 문제는 개발 서버에서는 재현되지 않는다. Next.js 압축은 프로덕션 서버에만 적용되므로
  `npm run dev`로 검증했던 이전 작업에서는 드러나지 않았고, frontend 컨테이너 배포 이후 처음
  나타났다. 이전 compose 작업에서 페이지 로드와 API 프록시는 확인했지만 컨테이너에서 실제 추천
  실행(SSE)까지 확인하지 않은 것이 검증 공백이었다.
  next.config에서 압축을 끄고, 백엔드 SSE 응답에도 표준 no-transform·버퍼링 금지 헤더를 붙여
  향후 다른 리버스 프록시 뒤에 배치되더라도 같은 문제가 재발하지 않게 한다.

