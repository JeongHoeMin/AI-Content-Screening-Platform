result:
  summary: >
    Next.js가 프록시 응답을 기본 gzip 압축하면서 SSE 청크를 압축 버퍼에 붙잡아 진행 상황 스트림이
    사실상 무력화되던 문제를 수정했다. frontend/next.config.ts에 compress: false를 설정하고,
    백엔드 SSE 응답에도 Cache-Control: no-cache, no-transform과 X-Accel-Buffering: no를 추가해
    향후 nginx 등 다른 리버스 프록시 뒤에 배치되더라도 같은 증상이 재발하지 않도록 했다.
    원인 규명 과정에서 두 개의 가설이 반증되었다는 점을 기록해 둔다. (1) 백엔드가 수집 완료 전에는
    heartbeat를 보내지 않는다 -> `_emit_heartbeats`가 수집 시작 전에 이미 기동함을 코드로 확인해
    반증. (2) 수집 단계가 이벤트 루프를 블로킹한다 -> HTTP 클라이언트가 asyncio.to_thread를 쓰는
    것을 확인해 반증. 백엔드 SSE를 직접 관찰하니 heartbeat가 5초 간격으로 정확히 나오고 있었고,
    프록시를 거친 curl도 45초에 14개를 정상 수신했다. 브라우저 raw EventSource만 readyState=1,
    오류 0인 상태에서 수신 0이었고, curl과 브라우저의 유일한 차이인 Accept-Encoding을 바꿔
    비교하면서 원인을 확정했다.
    이 결함이 이전 작업에서 드러나지 않은 이유도 확인했다. Next.js 압축은 프로덕션 서버에만
    적용되므로 `npm run dev`로 브라우저 실행을 검증했던 대시보드 포팅 작업에서는 정상 동작했고,
    frontend 컨테이너 배포 이후에만 나타난다. compose 작업에서 페이지 로드와 API 프록시는
    확인했지만 컨테이너에서 SSE 추천 실행까지 확인하지 않은 것이 검증 공백이었다.
    부수적으로, 백그라운드 탭에서는 브라우저가 setInterval을 스로틀링해 "경과 시간" 표시가 멈추는
    것을 관찰했다. 이는 SSE와 무관한 브라우저 기본 동작이며(같은 시점에 heartbeat 시각은 계속
    갱신됨) 이번 작업에서 수정하지 않았다.

  changedFiles:
    - "frontend/next.config.ts"
    - "app/web/app.py"
    - "tests/test_web_dashboard.py"
    - "tasks/20260810-1520-sse-gzip-buffering-fix/task.yaml"

  verifications:
    - command: "동일 실행에 대해 Accept-Encoding만 바꿔 :3000 SSE 스트림 비교 (수정 전)"
      result: passed
      summary: >
        원인 확정 근거. identity는 t+0, 5, 10, 15, 20초에 데이터가 도착했고 gzip은 Content-Encoding:
        gzip이 붙은 채 t+0에 15바이트(gzip 헤더)만 오고 84초 동안 아무 데이터도 오지 않다가 실행
        종료 시 2807바이트가 한꺼번에 도착했다.

    - command: "uv run pytest -q"
      result: passed
      summary: >
        628개 통과, 1개 skip. SSE 응답이 no-transform과 X-Accel-Buffering: no를 반환하는지 검증하는
        테스트를 추가했다. 최초 작성한 테스트는 _RunState()를 이벤트 루프 밖에서 만들어
        RuntimeError로 실패했고, asyncio.Queue에 의존하지 않도록 events()를 오버라이드한 매니저로
        다시 작성해 통과시켰다.

    - command: "cd frontend && npm run lint && npm run build && npm test"
      result: passed
      summary: "lint 오류 0건, 4개 라우트 빌드 성공, vitest 13건 통과."

    - command: "docker-compose up -d --build dashboard frontend 후 Accept-Encoding: gzip 스트림 재확인"
      result: passed
      summary: >
        수정 후 gzip을 요청해도 Content-Encoding이 없고 t+0, 5, 10, 15초에 데이터가 정상 도착했다.
        수정 전 84초 정적이던 것과 대비된다.

    - command: "브라우저(컨테이너 프로덕션 빌드)에서 추천 실행 후 진행 상황 관찰"
      result: passed
      summary: >
        t+21초에 타임라인 5건·3/13 단계 완료·서버 확인 2초 전으로 갱신되어 실행 중 실시간 반영을
        확인했다. 긴 extract 단계 동안에도 heartbeat 시각이 계속 갱신되었고, 최종적으로 타임라인
        16건·13/13 단계 완료·버튼 복구·결과 렌더링까지 정상 동작했다. 수정 전 동일 화면에서는
        타임라인 0건·0/13 단계·서버 확인이 시작 시각에 멈춰 있었다.

  completedAt: "2026-08-10T15:29:08+09:00"

