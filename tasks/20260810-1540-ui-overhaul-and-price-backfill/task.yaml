schemaVersion: 1

id: "20260810-1540-ui-overhaul-and-price-backfill"
title: "UI 전면 개편과 추천 이력 점진 로딩, 미확인 진입가 백필, 실시간 실행 Telegram 발송"
description: >-
  Next.js 프런트엔드를 Tailwind CSS 기반 디자인 시스템으로 재작성해 버튼·링크·라벨 겹침을 제거하고
  세 화면의 정보 구조를 통일한다. 추천 이력 API가 저장된 스냅샷만으로 즉시 응답하도록 분리해
  화면이 먼저 데이터를 그린 뒤 손익률을 회차 단위로 채우게 한다. 진입가가 미확인인 추천에는
  추천 시각 기준 KRX 과거 종가를 다시 조회하는 셀 단위 재조회 버튼과 schedule-worker의 일 1회
  배치를 추가하고, 대시보드 실시간 추천 실행 결과도 Telegram으로 발송한다.

status: completed

createdAt: "2026-08-10T15:40:00+09:00"
updatedAt: "2026-08-10T16:16:05+09:00"

agent:
  provider: "codex"
  model: "gpt-5.6"
  sessionId: null

request:
  summary: >-
    디자인 겹침 해소를 포함한 UX/UI 전면 개편, 추천 이력 즉시 표시와 손익률 점진 갱신,
    미확인 진입가의 셀 단위 재조회 버튼과 일 1회 배치, 대시보드 실시간 추천의 Telegram 발송.
  originalPrompt: |
    수정이필요해.

    1. 전체적인 디자인 수정. 현재 버튼이나 링크, 라벨이 겹쳐보이는 이슈있음.
    2. 좀더 시각적으로 사용자가 보기 편한 디자인설계구조였으면함. UX/UI 전체를 손봐야함.
    3. 추천이력페이지에서 이력을불러오는동안 아무것도 화면에 나오지않아 적재된데이터도 없는것처럼 보임. 먼저 데이터를 화면에 보여주고 손익률 계산은 실시간으로 계산된 것 부터 업데이트 하는것이 좋을것같음.
    4. 과거에 손익률 미확인된 종목에 대해선 과거 추천 시각때의 가격을 확인할 수 있도록 진행 필요(이 부분에대해선 각 미확인 칸에 리로딩 버튼이있었으면 하고 일배치로 하루에 한번 조회 할수 있었으면 함.)
    5. 대시보드에서 "추천받기"버튼으로 실시간 추천을 확인해도 텔레그램으로 결과를 쏴줘야함.

    (대화 중 확정한 선택: Telegram은 자격 증명이 설정되어 있으면 항상 발송, 스타일링은 Tailwind CSS 도입,
    일 1회 배치는 기존 schedule-worker 안에서 실행, Hook 런처의 macOS Python 탐색 오류 수정 승인.)

