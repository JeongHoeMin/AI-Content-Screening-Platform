requirements:
  items:
    - "모든 화면에서 버튼, 링크, 라벨이 서로 겹치지 않는다. 특히 실행 옵션의 숨김 radio/checkbox input이 문서 좌상단에 절대배치되어 다른 요소 위에 겹치던 문제가 제거된다."
    - "대시보드, 추천 이력, 정기 실행 설정 세 화면이 공통 상단 네비게이션, 페이지 셸, 카드, 표 스타일을 공유하는 Tailwind 기반 디자인 시스템으로 재작성된다."
    - "GET /api/runs/history 는 외부 가격 API를 호출하지 않고 저장된 스냅샷만으로 즉시 응답한다."
    - "추천 이력 페이지는 응답을 받는 즉시 모든 회차와 종목을 표시하고, 손익률은 회차별 갱신이 끝나는 순서대로 화면에 반영된다."
    - "회차 단위 최신가 갱신 endpoint가 해당 회차만 갱신하고 갱신된 회차 항목을 반환한다."
    - "진입가가 미확인인 항목은 추천 시각 기준 KRX 과거 종가로 재조회되며 KIS 실시간 시세를 사용하지 않는다."
    - "이미 가격이 확인된 entry 스냅샷은 재조회로 덮어쓰이지 않는다."
    - "추천 이력의 각 미확인 진입가 칸에 재조회 버튼이 있고, 버튼을 누르면 해당 항목만 갱신된다."
    - "schedule-worker가 하루에 한 번 미확인 진입가 백필을 실행하고 같은 KST 날짜에는 중복 실행하지 않는다."
    - "대시보드 추천받기로 시작한 실행이 완료되면 Telegram 자격 증명이 설정된 경우 결과 요약이 발송된다."
    - "정기 실행 경로에서는 Telegram 발송이 중복되지 않는다."
    - "Telegram 발송 실패가 추천 실행 결과나 SSE 완료 이벤트를 바꾸지 않는다."
    - "dashboard compose 서비스가 TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 환경변수를 전달받는다."
    - "새 API 경계와 entry 백필 정책이 docs/ARCHITECTURE.md 와 docs/DECISION_LOG.md 에 기록된다."

