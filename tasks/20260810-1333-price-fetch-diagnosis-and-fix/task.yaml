id: "20260810-1333-price-fetch-diagnosis-and-fix"
title: "매수/매도 추천 현재가 조회 원인 조사 및 KIS 토큰 갱신 버그 수정"
description: |
  사용자가 매수/매도 추천 시 현재 주가가 표시되지 않는다고 보고했다. 조사 결과 가격 조회·기록·
  성과 계산 기능(app/market_prices/**, app/harness/recommendation_prices.py,
  recommendation_price_snapshots 테이블, 대시보드의 "가격 성과" 컬럼)은 이미 구현되어 있었다.
  실행 중인 docker 컨테이너의 실제 DB(recommendation_price_snapshots)를 직접 조회한 결과 모든
  스냅샷이 status=unavailable, error_kind=authentication으로 기록되어 있었다. .env의 값을
  노출하지 않고 길이만 확인한 결과 KIS_APP_KEY/KIS_APP_SECRET이 3자리(플레이스홀더로 추정)였고
  KRX_API_KEY(40자리)도 KRX 서버에서 인증 거부를 받고 있었다.
  코드 검토 중 별도 버그를 발견했다: KisRealtimePriceClient는 access_token을 프로세스 수명
  동안 무기한 캐시하며, 캐시된 토큰이 이후(만료 등) 가격 조회 자체에서 401/403을 받아도 토큰을
  무효화하지 않는다. 즉 유효한 키로 한 번 인증에 성공하더라도 토큰이 만료되면 프로세스를 재시작할
  때까지 영구적으로 인증 실패가 반복된다. 이 작업에서는 이 토큰 갱신 버그를 수정하고, "가격
  미확인" 상태의 실패 사유(error_kind)를 API와 대시보드에 노출해 향후 자격 증명 문제를 화면에서
  바로 진단할 수 있게 한다. 사용자가 실제 유효한 KIS/KRX 키를 .env에 반영하면 그 시점에 별도로
  실계약 테스트(RUN_LIVE_MARKET_DATA_TESTS=1)를 수행한다.

status: completed

