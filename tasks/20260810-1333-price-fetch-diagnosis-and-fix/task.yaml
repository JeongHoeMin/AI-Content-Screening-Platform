result:
  summary: >
    가격 조회 기능은 이미 구현되어 있었으나(app/market_prices/**, price snapshot 저장, 성과 API,
    대시보드 표시), 실행 중인 docker 컨테이너 DB를 직접 조회해 모든 가격 스냅샷이
    status=unavailable, error_kind=authentication으로 기록되고 있음을 확인했다. KIS_APP_KEY/
    APP_SECRET은 자리수로 볼 때 플레이스홀더로 보이고 KRX_API_KEY도 서버에서 인증을 거부하고
    있어 근본 원인은 두 외부 시세 공급자의 자격 증명 문제다(사용자가 추후 .env에 실제 키를
    반영하기로 함). 이와 별개로 코드 검토 중 실제 버그를 발견해 수정했다: KisRealtimePriceClient가
    access_token을 프로세스 수명 동안 무기한 캐시하면서, 캐시된 토큰이 이후 가격 조회에서
    401/403을 받아도 무효화하지 않아 유효한 키로 최초 인증에 성공하더라도 토큰이 만료되면
    프로세스 재시작 전까지 영구적으로 인증 실패가 반복되는 문제였다. 이번 수정으로 인증 실패 시
    캐시된 토큰을 무효화해 다음 호출에서 재인증하도록 했다. 또한 "가격 미확인" 상태의 실패
    사유(error_kind)를 성과 API 응답과 대시보드 UI에 노출해 향후 자격 증명 문제를 화면에서 바로
    진단할 수 있게 했다. 실제 유효한 KIS/KRX 키가 .env에 반영되지 않았으므로 실계약(live) 검증은
    수행하지 못했다 — 사용자가 키를 넣었다고 알리면 RUN_LIVE_MARKET_DATA_TESTS=1로 재검증해야 한다.

