title: "진입가 재조회 실패 사유 갱신"
description: >-
  미확인 진입가를 재조회할 때 KRX 조회가 다시 실패해도 최초 저장된 오류 사유가 그대로 남아
  사용자가 실패 원인을 알 수 없다. 재조회 결과의 제한된 오류 종류를 안전하게 저장·응답하고
  재조회 버튼 옆의 사유를 즉시 최신 값으로 갱신한다.

