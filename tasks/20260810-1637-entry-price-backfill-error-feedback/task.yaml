    - "미확인 진입가의 재조회가 UNAVAILABLE 결과를 받으면 그 조회의 제한된 error_kind가 entry 스냅샷에 저장된다."
    - "재조회 중 예외가 발생하면 transport 오류로 안전하게 기록되어 다른 항목이나 API 응답을 실패시키지 않는다."
    - "재조회 API 응답을 받은 추천 이력 화면은 재조회 버튼 옆에 최신 실패 사유를 표시한다."
    - "이미 AVAILABLE인 entry 스냅샷은 재조회 결과로 변경되지 않는다."
    - "가격 백필 정책의 오류 사유 갱신 계약이 아키텍처 문서에 기록된다."

