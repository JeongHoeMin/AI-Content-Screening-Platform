history:
  - at: "2026-08-10T11:36:35+09:00"
    status: in_progress
    message: "Task created after live-reproducing the deduplicate BadRequestError via a direct OpenAI API call inside the running dashboard container (confirmed root cause before creating this task.yaml, since it was pure read-only investigation with no file changes). Proceeding to fix DeduplicationComparisonResponseItem's field types, which was edited moments before this task.yaml was written; recorded here as the first in-scope change."

  - at: "2026-08-10T11:45:00+09:00"
    status: in_progress
    message: "Fixed DeduplicationComparisonResponseItem to use the Union[StrictInt/StrictStr/StrictBool/..., None] pattern already established in app/models/screening.py and app/models/cross_validation.py, instead of a plain Optional[int]/Optional[str] first attempt, for consistency with how this codebase keeps LLM response fields defensively typed for the Parser while still satisfying OpenAI strict-schema requirements. Verified via a real OpenAI API call inside the running dashboard container (docker cp of the fixed file) that the BadRequestError is gone and the call succeeds. Added a fast offline regression test (schema anyOf check, mirroring the existing pattern in tests/test_llm_cross_validator.py) so this class of bug is caught without needing a live API call. Full pytest suite: 612 passed, 1 skipped."

  - at: "2026-08-10T11:55:00+09:00"
    status: in_progress
    message: "Confirmed OpenDART list.json's real response envelope (status/message/page_no/page_count/total_count/total_page/list) via a live call inside the container. Rewrote DartDisclosureProvider.collect to paginate at a fixed page_count=100 (independent of CollectPostsRequest.limit) up to a 5-page safety cap, using total_page to decide whether to continue. Updated the existing page_count=='5' assertion (now '100') and added two new tests: multi-page aggregation and the 5-page safety-cap stop. Updated docs/WORKFLOW.md to describe the discovery-scan-vs-display-limit split. Full pytest suite: 614 passed, 1 skipped."

  - at: "2026-08-10T12:00:00+09:00"
    status: in_progress
    message: "Allowed paths expanded to app/prompt_templates/screening.py and tests/test_llm_event_screener.py. After redeploying with both fixes, a live browser run got past deduplicate for the first time but then failed at screen with the same unexpected_error signature. Confirmed via a live API call with realistic official-DART-filing content (not synthetic short text) that gpt-4o-mini omits requires_cross_validation entirely (returns null) for exactly this kind of well-sourced primary-source content, because the prompt said 'Set requires_cross_validation when [conditions]' which reads as conditional presence rather than an always-required field; DefaultScreeningAssessmentParser's `type(value) is not bool` check then rejects every candidate in the batch, and NoValidScreeningDecisionsError's underlying provider error type isn't in the dashboard's safe-error allowlist so it renders as unexpected_error. This is a systemic, not one-off, bug: DART is now the default discovery source (ADR-026) and official filings are structurally exactly the 'well-sourced, not weak/anonymous/disputed' case the old wording invited the model to skip. Reworded the prompt to require an explicit true/false always. Re-verified with the same realistic content that the model now returns false correctly. Added a prompt-content regression test. Full pytest suite: 615 passed, 1 skipped."
