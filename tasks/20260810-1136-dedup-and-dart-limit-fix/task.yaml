id: "20260810-1136-dedup-and-dart-limit-fix"
title: "deduplicate unexpected_error 및 DART page_count/period 결합 문제 조사·수정"
description: "직전 작업에서 실제 대시보드 실행 중 발견하고 후속 과제로 남긴 두 가지 문제를 조사하고 수정한다. (1) deduplicate 단계가 매 실행마다 unexpected_error로 중단되는 문제 — 원인은 DeduplicationComparisonResponseItem이 candidate_index/relation/confidence/reasons 필드를 bare object로 선언해, OpenAI Structured Outputs strict mode가 'schema must have a type key' BadRequestError로 거부하기 때문임을 실제 API 호출로 재현·확인했다. (2) 대시보드 '분석 건수' 선택이 DART list.json 조회의 page_count를 그대로 결정해, period_hours를 7일로 늘려도 소규모 건수 선택 시 DART가 최신 소수 건만 반환해 event-type allowlist 통과 건이 0에 가까워지는 문제 — discovery 목록 조회를 표시 건수와 분리해 별도 상한으로 늘린다. 완료 후 docker compose로 재배포하고 실제 브라우저에서 확인한다."

