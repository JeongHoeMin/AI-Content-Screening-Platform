      description: "RecommendationPerformanceService의 refresh_and_query 내부 로직(entries 수집, latest 갱신, performance 계산)을 재사용 가능한 형태로 정리한다."
      status: completed

    - id: 2
      description: "run_id별로 묶은 이력 응답 모델(RecommendationRunHistoryItem/Response)과 list_run_histories() 메서드를 추가한다."
      status: completed

    - id: 3
      description: "DashboardRunManager와 FastAPI에 GET /api/runs/history 엔드포인트를 추가한다."
      status: completed

    - id: 4
      description: "app/web/history_html.py에 회차별 이력·손익률을 보여주는 정적 페이지를 추가하고 GET /history 라우트를 연결한다."
      status: completed

    - id: 5
      description: "새 서비스 메서드·API·페이지에 대한 단위 테스트를 추가한다."
      status: completed

    - id: 6
      description: "uv run pytest 및 uv run python -m compileall app tests로 전체 검증한다."
      status: completed

result:
  summary: >
    recommendation_price_snapshots에 이미 저장되어 있던 진입가/최신가 데이터를 재사용해 새
    마이그레이션 없이 회차(run)별 추천 이력을 조회하는 기능을 추가했다. RecommendationPerformance
    Service의 refresh_and_query 내부 로직을 _collect()로 추출해 재사용하면서 기존 API 동작은
    그대로 유지했고, run_id로 묶어 회차별 요약(승률·평균/중앙값 수익률 등)과 종목별 손익률을
    반환하는 list_run_histories()를 추가했다. 새 GET /api/runs/history API와 GET /history 정적
    페이지(app/web/history_html.py)를 추가해 과거 여러 회차의 매수/매도 추천이 그때 샀거나
    팔았다면 몇 퍼센트였는지 한 화면에서 확인할 수 있게 했고, 가격 미확인 사유(인증 실패 등)도
    함께 표시한다. 대시보드에 /history, /settings로 가는 nav 링크를 추가해 페이지를 찾을 수
    있게 했다(원래 allowedPaths에 없던 app/web/dashboard_html.py 변경이라 범위를 먼저 갱신했다).

