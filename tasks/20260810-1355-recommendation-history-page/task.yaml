requirements:
  items:
    - "recommendation_price_snapshots에 이미 저장된 회차(run)별 추천 기록을 재사용해 별도 마이그레이션 없이 이력을 조회할 수 있어야 한다."
    - "GET /api/runs/history API가 회차별로 묶인 추천 목록과 각 종목의 진입가/현재가/손익률(return_percent)을 반환해야 한다."
    - "각 회차 요약(확인 건수, 승률, 평균/중앙값 수익률)도 함께 반환해야 한다."
    - "GET /history 페이지가 회차 목록과 회차별 매수·매도 종목의 손익률을 사람이 읽을 수 있는 형태로 표시해야 한다."
    - "기존 /api/recommendations/performance 응답과 동작은 이번 변경으로 바뀌지 않아야 한다."
    - "새 동작을 검증하는 단위 테스트를 추가하고 관련 테스트 스위트를 실행한다."

