schemaVersion: 1

id: "20260810-1355-recommendation-history-page"
title: "추천 이력 조회 페이지 추가 (매수·매도 종목 손익 비교)"
description: |
  사용자 요청 2번: 매 작업(추천 실행) 기록을 DB에 저장하고, 추천 시각 기준 가격과 현재가를
  비교해 매수/매도 추천 종목이 그때 샀거나 팔았다면 몇 퍼센트 이득/손해였는지 화면에서 확인할 수
  있는 페이지를 만든다. 조사 결과 recommendation_price_snapshots 테이블(진입가·최신가, run_id별
  종목·액션 포함)과 RecommendationPerformanceService/Policy(수익률 계산)는 이미 구현되어 있었지만,
  대시보드는 방금 실행한 run 1건의 성과만 보여줄 뿐 과거 여러 run을 한 화면에서 조회하는 API와
  페이지가 없었다. 이 작업은 기존 recommendation_price_snapshots 데이터를 run_id로 묶어 여러 회차의
  추천 이력과 손익률을 보여주는 새 API(GET /api/runs/history)와 새 정적 페이지(GET /history)를
  추가한다. 새 DB 테이블이나 마이그레이션은 필요하지 않다 — 기존 저장 데이터를 재사용한다.

status: completed

createdAt: "2026-08-10T13:37:15+09:00"
updatedAt: "2026-08-10T13:50:00+09:00"

agent:
  provider: "claude-code"
  model: "claude-sonnet-5"
  sessionId: null

request:
  summary: "매 추천 실행 기록을 DB에 저장하고, 회차별 매수/매도 종목의 진입가 대비 현재가 손익률을 볼 수 있는 조회 페이지를 만든다. (사용자 3개 요청 중 우선순위 2번)"
  originalPrompt: "2. 매 작업 시의 기록을 DB에 저장하고 이를 확인할 수 있는 페이지 만들기. 해당 추천 시각기준으로 현재 주가와 비교해서 매수 추천 종목은 그때 샀으면/팔았으면 몇 퍼센트 이득이었다/손해봤다 이런것을 화면상에서 볼수 있어야해"

