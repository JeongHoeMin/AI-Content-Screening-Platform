requirements:
  items:
    - "Next.js 앱의 /history 경로가 회차별 추천 이력과 종목별 진입가·현재가·손익률을 표시해야 한다."
    - "가격을 확인할 수 없는 항목은 실패 사유(entry_error_kind/latest_error_kind)를 한글 문구로 표시해야 한다."
    - "Next.js 앱의 /settings 경로가 비밀번호 로그인 후 정기 실행 설정을 조회·저장할 수 있어야 한다."
    - "설정 저장 시 version 기반 낙관적 잠금을 유지하고 409 응답에 대해 사용자에게 충돌을 안내해야 한다."
    - "비밀번호를 브라우저에 저장하지 않고 로그인 요청에만 사용해야 한다."
    - "설정 화면이 아직 구성되지 않은 경우(404)에도 새 설정을 만들 수 있어야 한다."
    - "npm run build와 npm run lint가 오류 없이 통과해야 한다."
    - "실행 중인 실제 FastAPI 백엔드를 대상으로 브라우저에서 두 페이지의 동작을 직접 확인한다."

