schemaVersion: 1

id: "20260810-1422-nextjs-history-settings-pages"
title: "Next.js로 추천 이력(/history)·정기 실행 설정(/settings) 페이지 포팅"
description: |
  사용자 요청 3번(Next.js 전환)의 두 번째 하위 작업. 첫 하위 작업
  (tasks/20260810-1355-nextjs-dashboard-scaffold)에서 메인 대시보드를 포팅하면서 남겨둔
  /history와 /settings 페이지를 Next.js로 옮긴다. 현재 Next.js 앱에서 두 경로는 404이며 nav
  링크가 FastAPI가 서빙하는 정적 페이지를 가리키고 있다.
  /history는 app/web/history_html.py를, /settings는 app/web/settings_html.py를 각각 React로
  포팅한다. /settings는 비밀번호 로그인 후 HttpOnly 세션 쿠키(SameSite=strict, path=/api/settings)로
  보호되므로, 첫 하위 작업에서 설정한 next.config rewrites 프록시(동일 출처)를 그대로 사용해야
  쿠키가 유지된다. 비밀번호는 로그인 요청에만 사용하고 브라우저에 저장하지 않는 기존 동작을
  유지한다. 낙관적 잠금(version 필드, 409 충돌 처리)도 그대로 보존한다.
  FastAPI 백엔드는 변경하지 않는다. docker-compose 서비스 추가와 기존 정적 HTML 제거 여부는
  후속 작업으로 남긴다.

status: completed

createdAt: "2026-08-10T14:18:59+09:00"
updatedAt: "2026-08-10T14:24:30+09:00"

