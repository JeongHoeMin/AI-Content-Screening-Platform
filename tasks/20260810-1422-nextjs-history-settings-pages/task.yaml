result:
  summary: >
    Next.js 앱에 /history와 /settings 라우트를 추가해 app/web/history_html.py와
    app/web/settings_html.py의 화면을 React로 포팅했다. FastAPI 백엔드는 변경하지 않았다.
    /history는 회차별 요약과 종목별 진입가·현재가·손익률을 표시하고, 진입가나 현재가를 확인할 수
    없으면 entry_error_kind/latest_error_kind를 한글 문구로 보여준다. /settings는 비밀번호 로그인
    후 설정을 조회·저장하며, version 기반 낙관적 잠금과 409 충돌 안내, 설정이 없을 때(404) 새로
    만들 수 있는 경로, 비밀번호를 상태에 남기지 않고 요청 직후 비우는 동작을 모두 유지했다.
    작업 중 세 페이지의 브라우저 탭 제목이 모두 루트 layout의 "오늘의 투자 인사이트"로 표시되는
    문제를 발견해 history/settings에 라우트별 layout.tsx와 metadata를 추가했다. 테마·주제 카탈로그와
    toggle 헬퍼가 대시보드와 설정 화면에 중복되어 lib/catalog.ts로 추출했고, 페이지 간 nav 링크
    중복도 SiteNav 컴포넌트로 정리했다.
    남은 제한사항: 로그인 성공 이후의 설정 폼 렌더링은 화면으로 확인하지 않았다. 비밀번호를
    브라우저 폼에 직접 입력하는 것은 수행하지 않기 때문이며, 대신 로그인 API와 세션 쿠키 계약을
    curl로 검증했다. docker-compose에 frontend 서비스를 추가하는 작업과 기존 정적 HTML
    (app/web/*_html.py) 제거 여부 결정은 후속 작업으로 남는다.

  changedFiles:
    - "frontend/src/app/history/page.tsx"
    - "frontend/src/app/history/layout.tsx"
    - "frontend/src/app/settings/page.tsx"
    - "frontend/src/app/settings/layout.tsx"
    - "frontend/src/app/page.tsx"
    - "frontend/src/app/globals.css"
    - "frontend/src/components/SiteNav.tsx"
    - "frontend/src/components/RunControls.tsx"
    - "frontend/src/lib/catalog.ts"
    - "tasks/20260810-1422-nextjs-history-settings-pages/task.yaml"

  verifications:
    - command: "npx tsc --noEmit"
      result: passed
      summary: "타입 오류 없이 통과했다."

    - command: "npm run lint"
      result: passed
      summary: "ESLint 오류 0건으로 통과했다."

    - command: "npm run build"
      result: passed
      summary: "/, /history, /settings 세 라우트가 모두 정적으로 프리렌더링되며 빌드에 성공했다."

    - command: "브라우저에서 http://localhost:3000/history 확인 (실제 docker 백엔드 연결)"
      result: passed
      summary: >
        5개 회차가 최신순으로 렌더링되고 최신 회차의 실제 손익률(일성건설 1484원→1485원 +0.1%,
        다보링크 898원→904원 +0.7%)이 표시되었다. 진입가가 없는 과거 회차는 "가격 미확인
        (사유: 인증 실패)"로 표시되어 폴백 경로도 확인했다. 재조회 시 현재가가 갱신되어(1490→1485)
        실시간 KIS 조회가 동작함을 함께 확인했다.

    - command: "curl로 /api/settings/login → /api/settings/schedule 세션 쿠키 흐름 검증 (Next 프록시 :3000 경유)"
      result: passed
      summary: >
        로그인 204 응답과 함께 HttpOnly schedule_settings_session 쿠키(path=/api/settings)가
        설정되고, 해당 쿠키로 GET /api/settings/schedule이 200을 반환했으며, 쿠키 없이 요청하면
        401이 반환되었다. next.config rewrites의 동일 출처 프록시가 SameSite=strict HttpOnly
        쿠키를 보존한다는 설계 근거를 실제로 확인했다. 비밀번호 값은 출력하지 않았다.

    - command: "브라우저에서 http://localhost:3000/settings 및 / 확인"
      result: passed
      summary: >
        설정 페이지의 로그인 패널이 정상 렌더링되고 탭 제목이 라우트별 metadata대로 "정기 실행 설정"
        으로 표시되었다. 대시보드의 SiteNav가 /history, /settings 링크를 올바르게 노출하고 현재
        페이지 링크는 제외하는 것을 확인했다.

  completedAt: "2026-08-10T14:24:30+09:00"

