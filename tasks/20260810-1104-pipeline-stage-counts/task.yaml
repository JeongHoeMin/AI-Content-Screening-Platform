description: "사용자가 실행한 추천이 0건으로 끝난 원인 진단(수집 기간 24시간·좁은 이벤트 필터·테마 AND 조건) 이후, (1) 대시보드 기본 수집 기간을 24시간에서 7일(168시간, 기존 검증 상한과 동일)로 늘리고, (2) 대시보드 전체 진행 상황 파이프라인의 각 단계(수집·평가·추출·중복판정·스크리닝·교차검증·연결·분석·집계·점수화·추천·후보선택)마다 입력/통과/탈락 건수를 실시간으로 확인할 수 있도록 SSE 이벤트와 그래프 UI를 확장한다. 기존 워크플로우 노드의 Input/Output/Failure/Retry 계약과 CLI JSON 스키마는 변경하지 않는다."

