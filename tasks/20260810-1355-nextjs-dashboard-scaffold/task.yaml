result:
  summary: >
    frontend/에 Next.js 16(App Router, TypeScript, ESLint) 앱을 만들고 기존
    app/web/dashboard_html.py의 단일 정적 페이지를 React로 포팅했다. FastAPI 백엔드는 전혀
    변경하지 않았고, next.config.ts의 rewrites로 /api/*를 API_BASE_URL(기본 http://localhost:8000)로
    프록시해 브라우저 입장에서 동일 출처가 되도록 했다(설정 페이지 세션 쿠키가 SameSite=strict라
    CORS 대신 프록시를 선택했다). 워크플로우 13단계 정의·재시도 경로·단계별 입출력 카운트,
    SSE 이벤트 누적 로직(수집 이벤트의 단계 완료 처리와 workflow 노드 완료 시 이전 단계 skip 처리)을
    lib/stages.ts와 lib/useRecommendationRun.ts로 옮겼고, 실행 트리거·진행 상황·타임라인·분석 카드·
    후보 제외 진단·선택된 뉴스·성과 요약·추천 테이블을 컴포넌트로 분리했다. 외부 기사 URL은
    safeHref로 http(s)만 렌더링한다. 실제 docker 백엔드를 대상으로 브라우저에서 추천 실행을 끝까지
    수행해 13단계 완료·타임라인 15건·추천 종목(일성건설 013360 buy)·성과 요약이 정상 표시되는 것을
    확인했다. 가격 성과가 "사유 미상"으로 나오는데, 이는 실행 중인 docker 이미지가 Task 1의
    entry_error_kind 필드를 포함하기 전 코드라서이며 프론트가 필드 부재를 안전하게 처리한 결과다.
    (컨테이너 재빌드는 이 작업 범위가 아니다.)
    남은 제한사항: /history와 /settings 페이지는 아직 Next.js로 포팅하지 않아 nav 링크가 기존
    FastAPI 정적 페이지를 가리키며, Next.js 개발 서버에서는 해당 경로가 404다. docker-compose
    서비스 추가와 정적 HTML 제거 여부도 후속 작업으로 남는다.

