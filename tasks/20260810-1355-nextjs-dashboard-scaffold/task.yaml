schemaVersion: 1

id: "20260810-1355-nextjs-dashboard-scaffold"
title: "Next.js 프론트엔드 스캐폴딩 및 메인 대시보드 페이지 포팅"
description: |
  사용자 요청 3번(Next.js 전환)의 첫 번째 하위 작업. 사용자가 확인한 방향대로 백엔드(FastAPI,
  app/web/app.py)는 그대로 유지하고, 새 frontend/ 디렉토리에 Next.js(App Router, TypeScript) 앱을
  만들어 기존 app/web/dashboard_html.py의 정적 단일 페이지(오늘의 투자 인사이트: 실행 트리거,
  SSE 실시간 진행상황, 워크플로우 그래프, 분석 카드, 추천 테이블+가격 성과)를 React로 포팅한다.
  브라우저-백엔드 간 쿠키(SameSite=strict) 문제를 피하기 위해 CORS를 여는 대신 Next.js
  next.config의 rewrites로 /api/* 요청을 FastAPI(API_BASE_URL 환경변수, 기본 http://localhost:8000)로
  프록시해 브라우저 입장에서는 항상 동일 출처로 보이게 한다. 이 방식은 FastAPI 쪽 코드를 전혀
  건드리지 않는다. 설정 페이지(/settings)와 이력 페이지(/history) 포팅, docker-compose 서비스
  추가는 각각 별도 후속 작업으로 분리한다. 정적 HTML(app/web/*_html.py) 제거 여부는 모든 페이지
  포팅이 끝난 뒤 사용자와 확인한다.

status: completed

