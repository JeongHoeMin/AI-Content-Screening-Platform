requirements:
  items:
    - "frontend/ 디렉토리에 TypeScript + App Router 기반 Next.js 앱을 생성한다."
    - "브라우저에서 보내는 /api/* 요청이 Next.js rewrites를 통해 FastAPI 백엔드로 프록시되어야 한다(FastAPI 코드는 변경하지 않는다)."
    - "메인 대시보드 페이지가 추천 실행 트리거(분석 건수·테마·주제 선택), SSE 기반 실시간 진행 상황(워크플로우 그래프·타임라인), 분석 카드, 후보 제외 진단, 선택된 뉴스, 추천 성과 요약, 매수·매도 추천 테이블(가격 성과 포함)을 기존 대시보드와 동등하게 표시해야 한다."
    - "/history, /settings로 가는 nav 링크를 유지한다(다음 하위 작업에서 해당 페이지들을 Next.js로 포팅하기 전까지는 기존 FastAPI 정적 페이지를 가리킨다)."
    - "npm run build(프로덕션 빌드)와 npm run lint가 오류 없이 통과해야 한다."
    - "실행 중인 실제 FastAPI 백엔드(docker, localhost:8000)를 대상으로 브라우저에서 추천 실행 흐름이 동작하는지 직접 확인한다."

