requirements:
  items:
    - "DartDisclosureProvider는 문서(document) 전문을 가져오기 전에 report_name을 결정적 event-type allowlist로 판정하고, 통과하지 못한 공시는 document API를 호출하지 않고 건너뛴다."
    - "event-type allowlist는 LLM이 아니라 코드가 소유하는 결정적 규칙(catalog)으로 구현하고 버전을 갖는다."
    - "create_market_collect_posts_skill은 IR_RSS_FEEDS가 비어 있어도 DART 등 다른 provider가 하나 이상 구성되어 있으면 오류 없이 동작하고, 사용 가능한 provider가 하나도 없을 때만 ConfigurationError를 발생시킨다."
    - "대시보드 기본 분석 source(DEFAULT_ANALYSIS_SOURCES)와 CLI --sources 기본값이 DART를 포함하도록 바뀌어, 운영자가 IR_RSS를 등록하지 않아도 기본 실행이 시장 전체 공시를 대상으로 동작한다."
    - "docs/WORKFLOW.md의 기존 source 정책 설명 단락을 새 동작(DART 기본 discovery + event-type 사전 필터, IR_RSS는 선택적 보강)에 맞게 갱신한다."
    - "기존 워크플로우 노드(Evaluate~Recommend) 계약과 CLI JSON 출력 스키마는 변경하지 않는다."
    - "새로 추가/변경된 동작을 검증하는 단위 테스트를 추가하고 전체 pytest 스위트가 통과한다."

