description: "ADR-026/ROADMAP Phase 10에서 승인된 v1 설계를 구현한다. DartDisclosureProvider가 문서 전문을 가져오기 전에 결정적 event-type allowlist로 사전 필터링하도록 바꾸고, IR_RSS_FEEDS 없이도 DART만으로 기본 실행이 가능하도록 create_market_collect_posts_skill과 DEFAULT_ANALYSIS_SOURCES/CLI 기본값을 바꾼다. 기존 workflow 노드(Evaluate 이후) 계약은 변경하지 않는다."

