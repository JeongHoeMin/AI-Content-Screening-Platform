result:
  summary: >-
    SSE는 진행 event를 전달하는 best-effort transport로 유지하되, EventSource 오류 시 1초·3초의
    제한된 재연결과 실행 결과 endpoint 조회를 수행하도록 변경했다. 결과가 완료면 화면이 완료·추천
    결과로 복구되고, 409 실행 중 응답은 재시도하며, 실제 server failure 또는 복구 예산 소진일 때만
    중단됨을 표시한다. Dashboard는 server stream open·terminal 전달·close와 browser 오류·복구 결과를
    run ID, 제한된 lifecycle/diagnostic event, attempt만으로 runtime JSONL에 기록한다.
