  items:
    - "SSE 구독의 시작·정상 terminal 전달·예기치 않은 종료를 실행 ID와 제한된 종료 이유로 서버 로그에서 구분할 수 있다."
    - "브라우저 EventSource 오류는 실행 ID와 제한된 연결 상태를 포함한 진단 정보를 사용자에게 노출하지 않고 운영 로그에만 남긴다."
    - "일시적 SSE 연결 종료 뒤에도 실행이 서버에서 완료되면 결과 조회를 통해 대시보드가 완료 상태와 결과를 표시한다."
    - "SSE 복구 중 서버가 실제 실패 결과를 반환하면 대시보드는 안전한 실패 상태만 표시한다."
    - "진단 데이터에는 기사 본문, prompt, SDK 응답 전문, 인증 정보 또는 무제한 예외 문자열을 포함하지 않는다."
    - "기존 SSE event 계약과 정상 추천 실행 결과를 변경하지 않는다."
    - "진단 로직은 backend 및 frontend 자동 테스트로 검증된다."

