title: "추천 실행 SSE 연결 진단 추가"
description: >-
  추천 워크플로우가 서버에서 정상 완료됐는데도 브라우저가 SSE 연결 종료를 즉시 중단으로 표시한
  사례를 진단하고 복구한다. 다음 실행에서 브라우저·Next.js 프록시·dashboard SSE 경계 중 종료
  지점을 제한된 메타데이터로 식별하고, 일시적인 SSE 종료 뒤에도 terminal 결과를 조회해 화면이
  실제 서버 결과를 반영하도록 한다.

