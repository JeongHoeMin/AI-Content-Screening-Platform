  - at: "2026-08-10T10:40:53+09:00"
    status: planning
    message: "Task created after discovering docker-compose.yml does not pass DART_API_KEY into containers and the postgres container has been stopped for 4 days, while investigating whether the service is currently operable."

  - at: "2026-08-10T10:41:30+09:00"
    status: in_progress
    message: "Added DART_API_KEY to docker-compose.yml dashboard and schedule-worker environment blocks; docker-compose config validated cleanly."

  - at: "2026-08-10T10:44:00+09:00"
    status: in_progress
    message: "Rebuilt images with --no-cache and ran docker-compose up -d: postgres restarted (existing postgres_data volume preserved), db-migrate exited 0, dashboard and schedule-worker recreated with the new image and DART_API_KEY."

  - at: "2026-08-10T10:46:00+09:00"
    status: completed
    message: "Verified dashboard healthy, /api/health OK, and DART provider registers without ConfigurationError inside the running container. Noted (not fixed, out of scope) that schedule-worker inherits the Dockerfile's port-8000 HEALTHCHECK even though it does not serve HTTP, so docker-compose ps will show it as unhealthy despite the process running correctly; this predates this task."
