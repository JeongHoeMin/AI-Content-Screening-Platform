history:
  - at: "2026-08-10T14:50:26+09:00"
    status: planning
    message: "Task created after diagnosing the permanently unhealthy schedule-worker: it inherits the API image's HTTP healthcheck but serves no HTTP. Chose a real heartbeat over disabling the check, because disabling would hide a genuinely dead worker just as effectively as the current broken check does."

  - at: "2026-08-10T14:52:00+09:00"
    status: in_progress
    message: "Implemented the heartbeat module, the healthcheck entry point, and the worker wiring. Ran the heartbeat refresh as a separate asyncio task rather than inside the polling loop, so a recommendation run that legitimately takes minutes cannot be mistaken for a stall."

  - at: "2026-08-10T14:53:30+09:00"
    status: testing
    message: "Verified the healthcheck exit codes for missing, fresh, stale, future, and custom-threshold heartbeats. An earlier attempt reported exit 0 for every case because the shell captured the exit status of a piped tail rather than the python command; re-measured without the pipe to get accurate codes."

  - at: "2026-08-10T14:54:44+09:00"
    status: completed
    message: "Task completed and verified. The container reached healthy within 10 seconds of redeploy, a deliberately staled heartbeat made the same check fail, and the worker then refreshed it on its own, proving the heartbeat task keeps running rather than writing once at startup."
