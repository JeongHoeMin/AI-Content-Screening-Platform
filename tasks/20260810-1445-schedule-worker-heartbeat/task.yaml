schemaVersion: 1

id: "20260810-1445-schedule-worker-heartbeat"
title: "schedule-worker의 잘못된 HTTP healthcheck를 실제 liveness heartbeat로 교체"
description: |
  schedule-worker 컨테이너가 영구적으로 unhealthy 상태다(연속 실패 52회 관측). 원인은 이 서비스가
  루트 Dockerfile을 그대로 사용하면서 그 안의 HEALTHCHECK(http://127.0.0.1:8000/api/health 호출)를
  상속받기 때문이다. 하지만 schedule-worker는 command를 `python -m app.scheduled_worker`로
  덮어써서 HTTP를 서빙하지 않으므로 이 healthcheck는 영원히 Connection refused로 실패한다.
  이 상태의 실질적 문제는 빨간 표시 자체가 아니라, 워커가 정상일 때와 실제로 죽었을 때를 구분할
  수 없다는 점이다. healthcheck를 단순히 끄면 표시만 사라지고 이 문제는 그대로 남는다.
  코드를 확인한 결과 워커는 30초 폴링 루프이며 실행이 발생했을 때만 로그를 남기고 유휴 시에는
  아무 관측 신호도 남기지 않는다. 따라서 워커가 주기적으로 heartbeat 파일을 갱신하도록 하고,
  healthcheck가 그 파일의 신선도를 검사하도록 바꾼다. heartbeat는 run_due와 독립된 asyncio task로
  기록해, 정상적으로 오래 걸리는 추천 실행 중에 거짓 unhealthy가 나지 않으면서도 이벤트 루프가
  멈추거나 프로세스가 죽으면 감지되도록 한다.
  이 작업은 이번 세션에서 발견한 기존 결함을 수정하는 것이며, Next.js 전환 작업과는 무관하다.

