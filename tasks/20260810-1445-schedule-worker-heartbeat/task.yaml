result:
  summary: >
    schedule-worker가 루트 Dockerfile의 HTTP healthcheck를 상속받아 영구 unhealthy(연속 실패 52회)
    이던 문제를 실제 liveness 신호로 교체해 해결했다. healthcheck를 끄는 대신 heartbeat를 도입한
    이유는, 끄면 표시만 사라질 뿐 워커가 실제로 죽었을 때와 정상일 때를 구분할 수 없다는 원래
    문제가 그대로 남기 때문이다.
    app/harness/worker_heartbeat.py가 heartbeat 기록·읽기·신선도 판정을 담당하고,
    app/worker_healthcheck.py가 컨테이너 healthcheck 진입점으로 동작한다. 워커의 run_forever는
    heartbeat를 run_due와 분리된 asyncio task로 10초마다 갱신하므로, 몇 분씩 걸리는 정상적인 추천
    실행 중에도 거짓 unhealthy가 발생하지 않으면서 프로세스가 죽거나 이벤트 루프가 막히면 감지된다.
    heartbeat에는 관측 시각만 기록하고 실행 내용·자격 증명은 담지 않는다. 미래 시각 heartbeat는
    기록 측과 검사 측 시계가 어긋났다는 뜻이라 신뢰할 수 없으므로 실패로 처리한다. heartbeat 쓰기
    실패는 경고 로그만 남기고 워커 루프를 중단시키지 않는다.
    heartbeat 파일은 볼륨이 아닌 컨테이너 로컬 경로(/tmp)에 두어 호스트를 오염시키지 않고 컨테이너
    단위 liveness를 정확히 반영하게 했다.

