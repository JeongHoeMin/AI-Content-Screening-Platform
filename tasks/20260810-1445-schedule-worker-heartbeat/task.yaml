    - command: "docker-compose up -d --build schedule-worker 후 docker inspect로 health 상태 확인"
      result: passed
      summary: >
        재배포 10초 만에 unhealthy(연속 실패 52회)에서 healthy(failing streak 0)로 전환되었고,
        dashboard·frontend·postgres를 포함한 4개 컨테이너가 모두 healthy 상태가 되었다.

    - command: "컨테이너 내부에서 heartbeat를 인위적으로 10분 전으로 조작한 뒤 healthcheck 실행 및 자동 복구 확인"
      result: passed
      summary: >
        조작 직후 healthcheck가 'Worker heartbeat is stale'과 함께 exit 1을 반환해 죽은 워커를 실제로
        감지할 수 있음을 확인했다. 이어서 15초 뒤 heartbeat가 05:54:08에서 05:54:38로 워커에 의해
        자동 갱신되고 healthcheck가 다시 exit 0이 되어, heartbeat task가 기동 시 한 번만 쓰는 것이
        아니라 실제로 주기 실행 중임을 확인했다.

